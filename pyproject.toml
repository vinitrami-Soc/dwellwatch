[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwellwatch"
dynamic = ["version"]
description = "DwellWatch: ransomware early warning from the dwell-time stages of a help-desk-led intrusion"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinit Rami" }]
keywords = ["ransomware", "soc", "detection-engineering", "sigma", "wazuh", "mitre-attack", "correlation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pysigma>=1.0,<2",
    "pysigma-backend-splunk>=2.0,<3",
    # Sentinel and Defender XDR KQL; supersedes pysigma-backend-microsoft365defender
    "pysigma-backend-kusto>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/vinitrami-Soc/dwellwatch"
Issues = "https://github.com/vinitrami-Soc/dwellwatch/issues"

[tool.setuptools.dynamic]
version = { attr = "dwellwatch.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 115
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["dwellwatch"]
