name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check
          shellcheck datasets/fetch.sh
      - name: Conversions in converted/ match the Sigma rules
        run: python -m dwellwatch.convert --check
      - name: Fetch replay datasets
        run: datasets/fetch.sh
      - name: Tests, including the rules-on-real-data gate
        env:
          DWELLWATCH_REQUIRE_DATASETS: "1" # a missing dataset fails instead of skipping
        run: pytest

  metric:
    # The README leads with a measured number; this recomputes it from the pinned ransomware runs
    # (docs/metric-method.md) and fails if the README says anything else.
    name: headline metric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Cache the recordings
        uses: actions/cache@v6
        with:
          path: datasets/attack_data
          key: attack-data-metric-${{ hashFiles('datasets/fetch.sh') }}
      - name: Fetch the runs
        run: datasets/fetch.sh --metric
      - name: The README's headline matches the measured runs
        run: python -m dwellwatch.metric --check README.md
