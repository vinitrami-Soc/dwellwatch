name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check
          shellcheck datasets/fetch.sh
      - name: Fetch replay datasets
        run: datasets/fetch.sh
      - name: Tests, including the rules-on-real-data gate
        env:
          DWELLWATCH_REQUIRE_DATASETS: "1" # a missing dataset fails instead of skipping
        run: pytest
