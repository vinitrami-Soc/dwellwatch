# Wazuh rule IDs for the Sigma rules. Wazuh needs a stable number for every rule, in the range
# it keeps for local rules (100000 to 119999). Each Sigma rule gets a block of ten, one per Wazuh
# rule it expands into (per event source and per branch of its condition). Stage N uses 10N000 to
# 10N990. Add a line when you add a rule; never reuse or renumber a block, because alerts and any
# Wazuh rules built on top of these refer to the numbers.

