title: LSASS Dump Or AD Database Written To Disk
id: d99bbf80-ba98-44e0-ba68-19692fbae605
status: experimental
description: |
  Detects the result of credential theft landing on disk: a dump file named after LSASS, as
  procdump, comsvcs.dll's MiniDump and Task Manager's "Create dump file" write it, or a copy of
  the AD database (NTDS.dit) anywhere other than its home in C:\Windows\NTDS. Catches the theft
  even when the tool that did it was not seen. Needs Sysmon event 11. DwellWatch stage 3
  (credential theft).
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/003/
author: Vinit Rami
date: 2026-09-28
tags:
  - attack.credential-access
  - attack.t1003.001
  - attack.t1003.003
logsource:
  category: file_event
  product: windows
detection:
  selection_lsass_name:
    TargetFilename|contains: 'lsass'
  selection_dump_extension:
    TargetFilename|endswith: '.dmp'
  selection_ntds:
    TargetFilename|endswith: '\ntds.dit'
  filter_ntds_home:
    TargetFilename|startswith: 'C:\Windows\NTDS\'
  condition: (selection_lsass_name and selection_dump_extension) or (selection_ntds and not filter_ntds_home)
falsepositives:
  - Windows Error Reporting's dump after LSASS crashes.
  - Install-from-media snapshots and backups that copy NTDS.dit on purpose.
level: high
