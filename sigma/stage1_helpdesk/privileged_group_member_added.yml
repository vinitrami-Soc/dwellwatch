title: Member Added To A Privileged Group
id: 3803236b-8f7a-40e7-bd0f-5aa3312df6c6
status: experimental
description: |
  Detects an account being added to a group that controls the domain or its hosts: Domain,
  Enterprise or Schema Admins, the local Administrators group, the Account, Server and Backup
  Operators, or DnsAdmins (Security 4728, 4732 and 4756). Once an attacker holds a reset
  account, adding it or a second account to one of these groups is how they keep and widen
  access. Groups are matched by well-known SID and by name, because a SIEM or an export may
  render the SID as a name. DwellWatch stage 1 (help-desk reset abuse).
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers
author: Vinit Rami
date: 2026-09-28
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID:
      - 4728 # member added to a security-enabled global group
      - 4732 # ... local group
      - 4756 # ... universal group
  selection_group:
    - TargetSid|endswith:
        - '-512' # Domain Admins
        - '-518' # Schema Admins
        - '-519' # Enterprise Admins
        - '-526' # Key Admins
        - '-527' # Enterprise Key Admins
    - TargetSid:
        - 'S-1-5-32-544' # Administrators
        - 'S-1-5-32-548' # Account Operators
        - 'S-1-5-32-549' # Server Operators
        - 'S-1-5-32-551' # Backup Operators
    - TargetUserName:
        - 'Domain Admins'
        - 'Enterprise Admins'
        - 'Schema Admins'
        - 'Key Admins'
        - 'Enterprise Key Admins'
        - 'Administrators'
        - 'Account Operators'
        - 'Server Operators'
        - 'Backup Operators'
        - 'DnsAdmins' # its SID is not well known; members can load code into the DNS service
  condition: all of selection_*
falsepositives:
  - Planned changes to administrator membership. These should be rare and go through change
    control; any that do not are worth asking about.
level: high
