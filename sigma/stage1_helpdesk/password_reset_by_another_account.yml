title: Password Reset On Another Account
id: 5a9f32cb-72f5-4f7a-8201-de8c0894cd9b
status: experimental
description: |
  Detects one account resetting another account's password (Security 4724; a user changing
  their own password is 4723). This is how a help-desk-led intrusion starts: the attacker
  phones the service desk as an employee and has that employee's password reset. On its own
  it is routine help-desk work, so it is a weak signal; it matters when the same account then
  shows other stages of the chain, which is what DwellWatch's correlation looks for.
  DwellWatch stage 1 (help-desk reset abuse).
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-320a
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4724
author: Vinit Rami
date: 2026-09-28
tags:
  - attack.persistence
  - attack.t1098
  - attack.t1078
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4724
  condition: selection
falsepositives:
  - Every password reset the service desk performs. Expect several a day in any organisation;
    alone this rule should feed correlation rather than page anyone.
level: medium
