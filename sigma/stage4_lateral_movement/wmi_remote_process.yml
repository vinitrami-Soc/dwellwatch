title: Process Started On Another Host With WMI
id: d34be004-8070-4c61-9845-59223e1918ec
status: experimental
description: |
  Detects a process being started on another machine through WMI's Win32_Process Create method:
  `wmic /node:<host> process call create`, or PowerShell's Invoke-WmiMethod and Invoke-CimMethod
  with a remote computer. Alerts on the machine the attacker works from. Impacket's wmiexec, which
  reaches the same method from outside Windows, is caught on the target by its output redirection
  in the PsExec and Impacket rule. DwellWatch stage 4 (lateral movement).
references:
  - https://attack.mitre.org/techniques/T1047/
author: Vinit Rami
date: 2026-09-28
tags:
  - attack.execution
  - attack.lateral-movement
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_wmic_binary:
    - Image|endswith: '\wmic.exe'
    - OriginalFileName: 'wmic.exe'
  selection_wmic_remote_create:
    CommandLine|contains|all:
      - '/node:'
      - 'process call create' # not `shadowcopy call create`, which makes a shadow copy
  selection_powershell_binary:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_powershell_remote_create:
    CommandLine|contains|all:
      - 'Win32_Process'
      - '-ComputerName'
  selection_powershell_method:
    CommandLine|contains:
      - 'Invoke-WmiMethod'
      - 'Invoke-CimMethod'
  condition: >-
    (selection_wmic_binary and selection_wmic_remote_create)
    or (selection_powershell_binary and selection_powershell_remote_create and selection_powershell_method)
falsepositives:
  - Administrators starting processes on servers through WMI; rarer than PsExec in most teams.
level: medium
